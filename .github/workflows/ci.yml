name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This repo's definition of green: check-types + lint + esbuild.
      - name: Compile
        run: npm run compile

      # Exactly what `vscode:prepublish` runs before every publish.
      - name: Production bundle
        run: npm run package

      # The test suite is deliberately NOT wired here. It runs inside a VS Code
      # Extension Host, which needs a virtual display (xvfb) on Linux runners —
      # a bigger setup with a real flakiness cost. Green here means the build
      # passes; run `npm test` locally before cutting a release.
